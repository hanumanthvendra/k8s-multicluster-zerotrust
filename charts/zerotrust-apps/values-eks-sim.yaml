# Development-like: auto-promote after preview smoke so kind can stay Healthy.
clusterName: eks-sim

frontend:
  enabled: true

badClient:
  enabled: true

blueGreen:
  autoPromotionEnabled: true
  previewReplicaCount: 1
  scaleDownDelaySeconds: 30
  abortScaleDownDelaySeconds: 30
  analysis:
    enabled: true
