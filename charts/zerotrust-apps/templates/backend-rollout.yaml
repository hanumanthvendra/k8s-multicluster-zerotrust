{{- if and .Values.backend.enabled .Values.blueGreen.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
  labels:
    app: backend
    {{- include "zerotrust.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ include "zerotrust.backendImage" . }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          env:
            - name: CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            - name: PORT
              value: {{ .Values.backend.listenPort | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.listenPort }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
  strategy:
    blueGreen:
      activeService: {{ include "zerotrust.activeService" . | quote }}
      previewService: {{ include "zerotrust.previewService" . | quote }}
      autoPromotionEnabled: {{ .Values.blueGreen.autoPromotionEnabled }}
      {{- with .Values.blueGreen.autoPromotionSeconds }}
      autoPromotionSeconds: {{ . }}
      {{- end }}
      previewReplicaCount: {{ .Values.blueGreen.previewReplicaCount }}
      scaleDownDelaySeconds: {{ .Values.blueGreen.scaleDownDelaySeconds }}
      abortScaleDownDelaySeconds: {{ .Values.blueGreen.abortScaleDownDelaySeconds }}
      {{- if .Values.blueGreen.analysis.enabled }}
      prePromotionAnalysis:
        templates:
          - templateName: backend-preview-smoke
      {{- end }}
{{- end }}
