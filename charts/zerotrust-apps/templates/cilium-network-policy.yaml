{{- if .Values.policy.enabled }}
# Identity-based authorization — no IP or CIDR.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: backend-allow-frontend
  labels:
    {{- include "zerotrust.labels" . | nindent 4 }}
spec:
  endpointSelector:
    matchLabels:
      app: backend
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: frontend
            io.cilium.k8s.policy.cluster: {{ .Values.policy.frontendCluster | quote }}
      toPorts:
        - ports:
            - port: {{ .Values.backend.listenPort | quote }}
              protocol: TCP
    # Preview smoke AnalysisRun Jobs (same namespace).
    - fromEndpoints:
        - matchLabels:
            app: backend-smoke
      toPorts:
        - ports:
            - port: {{ .Values.backend.listenPort | quote }}
              protocol: TCP
    # Web analysis runs from the Rollouts controller.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argo-rollouts
      toPorts:
        - ports:
            - port: {{ .Values.backend.listenPort | quote }}
              protocol: TCP
{{- end }}
