{{- if and .Values.backend.enabled .Values.blueGreen.analysis.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: backend-preview-smoke
  labels:
    {{- include "zerotrust.labels" . | nindent 4 }}
spec:
  # Lab: HTTP GET /health on the Preview Service from the Rollouts controller.
  # Do not use a Job here: after abort, Green is scaled to 0 and a Job hits
  # "Host is unreachable"; Argo CD also tries to open container "smoke" on
  # backend pods (that container does not exist). Production: Prometheus/Datadog
  # — see gitops/BLUE-GREEN.md
  metrics:
    - name: preview-http-health
      interval: 10s
      count: 3
      failureLimit: 1
      # /health returns JSON {"status":"ok"}; web provider unmarshals that to a map.
      successCondition: result.status == 'ok'
      provider:
        web:
          url: "http://{{ include "zerotrust.previewService" . }}.{{ .Release.Namespace }}.svc.cluster.local/health"
          timeoutSeconds: 10
{{- end }}
