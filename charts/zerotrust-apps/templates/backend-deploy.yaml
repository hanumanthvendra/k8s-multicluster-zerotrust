{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
    {{- include "zerotrust.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: "{{ include "zerotrust.backendImage" . }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          env:
            - name: CLUSTER_NAME
              value: {{ .Values.clusterName | quote }}
            - name: PORT
              value: {{ .Values.backend.listenPort | quote }}
          ports:
            - containerPort: {{ .Values.backend.listenPort }}
{{- end }}
