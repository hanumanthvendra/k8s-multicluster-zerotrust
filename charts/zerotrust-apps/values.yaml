# Default chart values. Cluster overlays: values-eks-sim.yaml / values-aks-sim.yaml

clusterName: eks-sim

backend:
  enabled: true
  replicaCount: 2
  image:
    # Local kind registry (scripts/07-local-registry.sh). Prod: GHCR/ECR/ACR, not Docker Hub.
    registry: "172.18.0.20:5000"
    repository: zerotrust-backend
    tag: "ba4d83c"
    pullPolicy: Always
  listenPort: 8080
  servicePort: 80
  globalService: true

frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: nicolaka/netshoot
    tag: latest
  # Pin off the egress-gateway node so the stable-egress demo is meaningful.
  nodeSelector:
    kubernetes.io/hostname: eks-sim-worker

badClient:
  enabled: false
  replicaCount: 1
  image:
    repository: nicolaka/netshoot
    tag: latest

# Identity-based authorization (no IPs). frontend lives in eks-sim and is
# allowed to reach backend in every mesh cluster.
policy:
  enabled: true
  frontendCluster: eks-sim
