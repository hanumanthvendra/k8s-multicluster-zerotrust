# Default chart values. Cluster overlays: values-eks-sim.yaml / values-aks-sim.yaml
# Lab registry is kind (scripts/07-local-registry.sh). Production: ECR/GHCR/ACR + digest.

clusterName: eks-sim

backend:
  enabled: true
  replicaCount: 1
  image:
    registry: "172.18.0.20:5000"
    repository: zerotrust-backend
    tag: "6a0c7bf"
    digest: "sha256:627372ba73a16ab58879f40cfbe2e0c667020226e24ff2514a01986e7775eaa5"
    pullPolicy: Always
  listenPort: 8080
  servicePort: 80
  globalService: true
  services:
    active: zerotrust-backend-active
    preview: zerotrust-backend-preview

frontend:
  enabled: false
  replicaCount: 1
  image:
    repository: nicolaka/netshoot
    tag: latest
  nodeSelector:
    kubernetes.io/hostname: eks-sim-worker

badClient:
  enabled: false
  replicaCount: 1
  image:
    repository: nicolaka/netshoot
    tag: latest

policy:
  enabled: true
  frontendCluster: eks-sim

# Blue/green is implemented by Argo Rollouts, not Jenkins.
# Overlays set env behaviour (dev vs staging-like). Production examples: gitops/BLUE-GREEN.md
blueGreen:
  enabled: true
  autoPromotionEnabled: false
  autoPromotionSeconds: null
  previewReplicaCount: 1
  scaleDownDelaySeconds: 300
  abortScaleDownDelaySeconds: 300
  analysis:
    enabled: true
    smokeImage: "172.18.0.20:5000/python:3.12-alpine"

previewIngress:
  enabled: false
  host: backend-preview.local
  className: ""
  annotations: {}

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: 1
