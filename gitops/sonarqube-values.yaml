# Kind lab SonarQube Community Build. Production: SonarCloud / managed SonarQube.
community:
  enabled: true

initSysctl:
  enabled: false
initFs:
  enabled: false

elasticsearch:
  bootstrapChecks: false

persistence:
  enabled: false

# Chart defaults request 2Gi / limit 6Gi — too large for kind.
resources:
  requests:
    cpu: 200m
    memory: 1Gi
    ephemeral-storage: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi
    ephemeral-storage: 8Gi

env:
  - name: SONAR_ES_BOOTSTRAP_CHECKS_DISABLE
    value: "true"

monitoringPasscode: "lab-sonar-passcode"

sonarProperties:
  sonar.forceAuthentication: "false"

service:
  type: NodePort
  externalPort: 9000
  internalPort: 9000
