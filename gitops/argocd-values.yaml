# Argo CD on kind (eks-sim hub). Insecure HTTP is fine for local NodePort/port-forward.
dex:
  enabled: false
notifications:
  enabled: false

configs:
  params:
    server.insecure: true
  cm:
    timeout.reconciliation: 30s
    # Rollouts patches Service selectors with rollouts-pod-template-hash.
    # Ignore only that field — not the whole Service/Rollout spec.
    resource.customizations.ignoreDifferences.Service: |
      jqPathExpressions:
        - .spec.selector["rollouts-pod-template-hash"]


server:
  extraArgs:
    - --insecure
  service:
    type: NodePort
    nodePortHttp: 30080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

controller:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

redis:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

applicationSet:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
